services:
  auth-server:
    image: ghcr.io/bourgils/forwardauth-hub:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: "${APP_NAME:-ForwardAuth Hub}"
      DATABASE_URL: sqlite:/data/auth.db
      SESSION_SECRET: ${SESSION_SECRET:?Set a random secret of at least 32 characters}
      SESSION_TTL: ${SESSION_TTL:-30d}
      SSO_MODE: ${SSO_MODE:-cross-domain}
      COOKIE_NAME: ${COOKIE_NAME:-coolify_auth}
      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME:-forwardauth_sso}
      APPLICATION_COOKIE_NAME: ${APPLICATION_COOKIE_NAME:-forwardauth_app}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      PUBLIC_URL: ${PUBLIC_URL:?Set the public auth URL, for example https://auth.example.com}
      AUTHORIZATION_CODE_TTL: ${AUTHORIZATION_CODE_TTL:-60s}
      CALLBACK_PATH: ${CALLBACK_PATH:-/_forwardauth/callback}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      ADMIN_UI_ENABLED: ${ADMIN_UI_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback,linklocal,uniquelocal}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forwardauth-callback.rule=Path(`${CALLBACK_PATH:-/_forwardauth/callback}`)"
      - "traefik.http.routers.forwardauth-callback.entrypoints=https"
      - "traefik.http.routers.forwardauth-callback.priority=10000"
      - "traefik.http.routers.forwardauth-callback.tls=true"
      - "traefik.http.routers.forwardauth-callback.service=forwardauth-callback"
      - "traefik.http.services.forwardauth-callback.loadbalancer.server.port=3000"
    volumes:
      - auth-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  auth-data:

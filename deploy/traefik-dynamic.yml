http:
  # The high-priority callback router is declared by the AuthServer container labels.
  middlewares:
    coolify-auth:
      forwardAuth:
        address: "https://auth.example.com/api/auth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Auth-User
          - X-Auth-User-Id
          - X-Auth-Email
          - X-Auth-Role
